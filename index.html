<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PULSE RADIO // LIVE AUDIO STREAM</title>

  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pulse Radio">
  <meta name="theme-color" content="#090A0F">

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((err) => {
          console.warn("ServiceWorker registration failed: ", err);
        });
      });
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary: #090A0F;
      --bg-card: rgba(22, 27, 34, 0.9);
      --border-line: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00F0FF;
      --accent-cyan-dim: rgba(0, 240, 255, 0.15);
      --accent-violet: #7928CA;
      --accent-crimson: #FF3B30;
      --text-main: #F0F6FC;
      --text-muted: #8B949E;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    }

    body {
      background: var(--bg-primary);
      background-image:
        radial-gradient(circle at 50% 0%, rgba(121, 40, 202, 0.22) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(0, 240, 255, 0.1) 0%, transparent 45%);
      color: var(--text-main);
      font-family: var(--font-ui);
      min-height: 100vh;
      min-height: 100dvh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: calc(64px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
      padding-left: calc(12px + env(safe-area-inset-left, 0px));
      padding-right: calc(12px + env(safe-area-inset-right, 0px));
      overflow-x: hidden;
    }

    header.fixed-top-banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(56px + env(safe-area-inset-top, 0px));
      padding: env(safe-area-inset-top, 0px) 20px 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(9, 10, 15, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-line);
      z-index: 1000;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255, 59, 48, 0.15);
      border: 1px solid var(--accent-crimson);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-crimson);
      letter-spacing: 1px;
    }

    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-crimson); box-shadow: 0 0 8px var(--accent-crimson); }
    .live-dot.active { animation: livePulse 1.5s infinite; }

    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .listeners-count {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--accent-cyan);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .container {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .deck-container {
      position: relative;
      width: clamp(200px, 45vw, 280px);
      height: clamp(200px, 45vw, 280px);
      margin: 16px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vinyl {
      width: 100%; height: 100%; border-radius: 50%;
      background: repeating-radial-gradient(#111, #111 2px, #181818 3px, #181818 4px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 0 4px rgba(255, 255, 255, 0.05);
      position: absolute; display: flex; align-items: center; justify-content: center;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .vinyl.spinning { animation: spinRecord 6s linear infinite; }
    @keyframes spinRecord { 100% { transform: rotate(360deg); } }

    .vinyl-label {
      width: 36%; height: 36%; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-cyan));
      border: 4px solid #000; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
    }

    .center-hole { width: 16px; height: 16px; background: #000; border-radius: 50%; }

    .vis-canvas {
      width: 100%;
      height: 80px;
      margin: 8px 0 14px 0;
      border-radius: 8px;
      display: block;
    }

    .meta-panel { text-align: center; margin-bottom: 16px; width: 100%; }
    .track-title { font-size: clamp(1.15rem, 3.5vw, 1.45rem); font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; color: var(--text-main); }
    .track-contributor { font-size: 0.9rem; color: var(--accent-cyan); font-family: var(--font-mono); margin-bottom: 4px; }
    .track-time { font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono); }

    .live-progress-container { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden; margin-bottom: 12px; cursor: pointer; }
    .live-progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-violet), var(--accent-cyan)); transition: width 0.25s linear; }

    .fixed-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(9, 10, 15, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-line);
      padding: 10px 20px calc(10px + env(safe-area-inset-bottom, 0px)) 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .controls-wrapper {
      width: 100%;
      max-width: 780px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 3vw, 22px);
      margin: 0 auto;
    }

    .ctrl-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-line);
      color: var(--text-main);
      width: 50px;
      height: 50px;
      min-width: 48px;
      min-height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ctrl-btn:hover { border-color: var(--accent-cyan); transform: scale(1.05); }

    .ctrl-btn.btn-play {
      width: 64px;
      height: 64px;
      background: var(--accent-cyan);
      color: #000;
      border: none;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.4);
    }

    .ctrl-btn.btn-play:hover { box-shadow: 0 0 24px rgba(0, 240, 255, 0.6); transform: scale(1.06); }
    .ctrl-btn svg { width: 22px; height: 22px; fill: currentColor; }
    .btn-play svg { width: 28px; height: 28px; }

    .mode-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-line);
      border-radius: 8px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 44px;
    }

    .mode-toggle-btn.active {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      background: var(--accent-cyan-dim);
    }

    .mode-toggle-btn svg { width: 16px; height: 16px; fill: currentColor; }

    button:focus-visible, input:focus-visible {
      outline: 3px solid var(--accent-cyan) !important;
      outline-offset: 4px !important;
    }

    .toast {
      position: fixed;
      bottom: calc(88px + env(safe-area-inset-bottom, 0px));
      background: rgba(22, 27, 34, 0.96);
      border: 1px solid var(--accent-cyan);
      color: var(--text-main);
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: var(--font-mono);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      transform: translateY(140px);
      transition: transform 0.3s ease;
      z-index: 1001;
      max-width: 90vw;
    }
    .toast.visible { transform: translateY(0); }
  </style>
</head>
<body>

  <header class="fixed-top-banner">
    <div class="live-badge">
      <span id="liveDot" class="live-dot"></span>
      <span id="liveStatusText">STANDBY</span>
    </div>
    <div class="listeners-count" id="listenerReadout">LISTENERS: 1 ACTIVE</div>
  </header>

  <div class="container">
    <div class="deck-container">
      <div id="vinylDisk" class="vinyl">
        <div class="vinyl-label">
          <div class="center-hole"></div>
        </div>
      </div>
    </div>

    <canvas id="visCanvas" class="vis-canvas"></canvas>

    <div class="meta-panel">
      <div id="currentTitle" class="track-title">Connecting to Broadcast Buffer...</div>
      <div id="currentContributor" class="track-contributor">Press Play / Tune In to Listen</div>
      <div id="currentTimestamp" class="track-time">--:-- / --:--</div>
    </div>

    <div class="live-progress-container" id="progressBarContainer">
      <div id="streamProgressBar" class="live-progress-bar"></div>
    </div>
  </div>

  <footer class="fixed-bottom-bar">
    <div class="controls-wrapper">
      <button id="modeToggleBtn" class="mode-toggle-btn" onclick="togglePlayMode()" title="Toggle Sequence Mode (Normal vs Shuffle)">
        <svg id="modeIcon" viewBox="0 0 24 24"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/></svg>
        <span id="modeLabel">NORMAL</span>
      </button>

      <div class="controls">
        <button class="ctrl-btn" onclick="skipToPreviousTrack()" title="Previous Transmission" aria-label="Previous Track">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <button id="masterPlayBtn" class="ctrl-btn btn-play" onclick="togglePlayback()" title="Tune In / Play" aria-label="Play or Pause">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button class="ctrl-btn" onclick="skipToNextTrack()" title="Next Transmission" aria-label="Next Track">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <div style="width: 88px; text-align: right;">
        <span id="queueCountReadout" style="font-family:var(--font-mono);font-size:0.75rem;color:var(--text-muted);">0 TRACKS</span>
      </div>
    </div>
  </footer>

  <div id="toastNotification" class="toast"></div>

  <audio id="radioAudio" playsinline webkit-playsinline preload="auto" crossorigin="anonymous"></audio>

  <script>
    const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbx7KalRgf2ndRhmSZx5RyxLdPW_52tPz4-EdI1Qih_I_7g-hQyMj_Zv01wqcJLjMMhm/exec";
    const POLL_INTERVAL = 15000;

    const isTV = /SmartTV|Tizen|Web0S|BRAVIA|Android TV|CrKey|Roku|FireTV|AFTB|Hisense/i.test(navigator.userAgent);

    let audioCtx = null;
    let analyser = null;
    let audioSourceNode = null;
    let masterGain = null;
    let isAudioGraphSetup = false;
    let isPlaying = false;
    let currentTrackIndex = 0;
    let animationFrame = null;
    let currentBlobUrl = null;
    let activeFetchAbortController = null;
    let cachedManifestEtag = null;

    let playMode = "normal";
    let unplayedShuffleIndices = [];

    let listenerSessionId = localStorage.getItem("PULSE_RADIO_LISTENER_ID");
    if (!listenerSessionId) {
      listenerSessionId = "lstnr_" + Math.random().toString(36).substring(2, 12);
      localStorage.setItem("PULSE_RADIO_LISTENER_ID", listenerSessionId);
    }

    let currentQueue = [];
    let priorityQueue = [];
    let pollTimerId = null;

    const audioElement = document.getElementById("radioAudio");

    window.addEventListener("DOMContentLoaded", () => {
      initAudioElementListeners();
      initVisibilityChangeHandler();
      initProgressBarSeek();
      initRemoteDpadKeys();

      fetchLiveManifest();
      pollTimerId = setInterval(fetchLiveManifest, POLL_INTERVAL);
    });

    function showToast(message) {
      const toast = document.getElementById("toastNotification");
      toast.textContent = message;
      toast.classList.add("visible");
      setTimeout(() => { toast.classList.remove("visible"); }, 3500);
    }

    function togglePlayMode() {
      playMode = (playMode === "normal") ? "shuffle" : "normal";
      const btn = document.getElementById("modeToggleBtn");
      const label = document.getElementById("modeLabel");

      if (playMode === "shuffle") {
        btn.classList.add("active");
        label.textContent = "SHUFFLE";
        initShufflePool();
        showToast("Switched to SHUFFLE mode");
      } else {
        btn.classList.remove("active");
        label.textContent = "NORMAL";
        showToast("Switched to NORMAL mode (Latest to Oldest)");
      }
    }

    function initShufflePool() {
      unplayedShuffleIndices = currentQueue.map((_, idx) => idx).filter(i => i !== currentTrackIndex);
      for (let i = unplayedShuffleIndices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [unplayedShuffleIndices[i], unplayedShuffleIndices[j]] = [unplayedShuffleIndices[j], unplayedShuffleIndices[i]];
      }
    }

    function setupAudioPipeline() {
      if (isAudioGraphSetup) {
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
        return;
      }

      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        audioCtx = new AudioContextClass();
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(1.0, audioCtx.currentTime);

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.82;

        audioSourceNode = audioCtx.createMediaElementSource(audioElement);
        audioSourceNode.connect(analyser);

        analyser.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        isAudioGraphSetup = true;

        if (audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }

        if (!isTV) renderVisualizer();
      } catch (err) {
        console.warn("Audio pipeline notice:", err);
      }
    }

    function initAudioElementListeners() {
      audioElement.addEventListener("ended", handleTrackEnded);

      audioElement.addEventListener("timeupdate", () => {
        if (!audioElement.duration || !isFinite(audioElement.duration)) return;
        const progress = (audioElement.currentTime / audioElement.duration) * 100;
        document.getElementById("streamProgressBar").style.width = progress + "%";

        const curSec = Math.floor(audioElement.currentTime);
        const durSec = Math.floor(audioElement.duration);
        document.getElementById("currentTimestamp").textContent =
          `${formatTime(curSec)} / ${formatTime(durSec)}`;
      });

      audioElement.addEventListener("error", (e) => {
        const err = audioElement.error;
        if (err && err.code === MediaError.MEDIA_ERR_ABORTED) return;
        console.warn("Audio error, attempting fallback proxy...", e);
        if (currentQueue.length > 0 && isPlaying) {
          fallbackStreamViaProxy(currentQueue[currentTrackIndex]);
        }
      });

      audioElement.addEventListener("playing", () => {
        isPlaying = true;
        updatePlayStateUI();
      });

      audioElement.addEventListener("pause", () => {
        isPlaying = false;
        updatePlayStateUI();
      });

      audioElement.addEventListener("waiting", () => {
        if (isPlaying) {
          document.getElementById("currentTitle").textContent = "Buffering broadcast stream...";
        }
      });
    }

    function initProgressBarSeek() {
      const container = document.getElementById("progressBarContainer");
      container.addEventListener("click", (e) => {
        if (!audioElement.duration || !isFinite(audioElement.duration)) return;
        const rect = container.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        audioElement.currentTime = pos * audioElement.duration;
      });
    }

    function initRemoteDpadKeys() {
      window.addEventListener("keydown", (e) => {
        if (e.key === "MediaPlayPause" || e.keyCode === 179) {
          e.preventDefault(); togglePlayback();
        } else if (e.key === "MediaTrackNext" || e.keyCode === 228) {
          e.preventDefault(); skipToNextTrack();
        } else if (e.key === "MediaTrackPrevious" || e.keyCode === 227) {
          e.preventDefault(); skipToPreviousTrack();
        }
      });
    }

    function syncMediaSession(track) {
      if ("mediaSession" in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title || track.fileName,
          artist: "Contributor: " + (track.uploaderName || "Anonymous"),
          album: "Pulse Radio // Live Audio Buffer",
          artwork: [
            { src: "https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=512&q=80", sizes: "512x512", type: "image/jpeg" }
          ]
        });

        navigator.mediaSession.setActionHandler("play", () => togglePlayback());
        navigator.mediaSession.setActionHandler("pause", () => togglePlayback());
        navigator.mediaSession.setActionHandler("nexttrack", () => skipToNextTrack());
        navigator.mediaSession.setActionHandler("previoustrack", () => skipToPreviousTrack());
      }
    }

    async function fetchLiveManifest() {
      try {
        let endpoint = `${GAS_ENDPOINT_URL}?action=getLiveManifest&listenerId=${encodeURIComponent(listenerSessionId)}`;
        if (cachedManifestEtag) {
          endpoint += `&etag=${encodeURIComponent(cachedManifestEtag)}`;
        }

        const res = await fetch(endpoint, { method: "GET", mode: "cors" });
        const json = await res.json();

        if (json.success && json.data) {
          if (json.data.activeListeners !== undefined) {
            document.getElementById("listenerReadout").textContent =
              `LISTENERS: ${json.data.activeListeners} ACTIVE`;
          }

          if (json.data.notModified) return;
          if (json.data.etag) cachedManifestEtag = json.data.etag;

          if (json.data.manifest) {
            reconcileIncomingManifest(json.data.manifest);
          }
        }
      } catch (err) {
        console.warn("Manifest background polling note:", err.message);
      }
    }

    function reconcileIncomingManifest(incomingTracks) {
      if (incomingTracks.length === 0) {
        document.getElementById("currentTitle").textContent = "Station Idle: No active broadcasts found.";
        document.getElementById("currentContributor").textContent = "Awaiting audio transmissions";
        return;
      }

      // Latest to Oldest by default
      const latestToOldest = incomingTracks.slice().reverse();
      document.getElementById("queueCountReadout").textContent = `${latestToOldest.length} TRACKS`;

      if (currentQueue.length === 0) {
        currentQueue = latestToOldest;
        currentTrackIndex = 0;
        const initial = currentQueue[0];
        document.getElementById("currentTitle").textContent = initial.title || initial.fileName;
        document.getElementById("currentContributor").textContent = `READY // @${initial.uploaderUsername} (${initial.uploaderName})`;
        preloadNextTrack();
        return;
      }

      const existingIds = new Set(currentQueue.map(t => t.contentId));
      const newlyAddedTracks = latestToOldest.filter(t => !existingIds.has(t.contentId));

      if (newlyAddedTracks.length > 0) {
        newlyAddedTracks.forEach(newTrack => priorityQueue.push(newTrack));
        showToast("New audio transmission received! Up next immediately.");
      }

      const activeContentId = currentQueue[currentTrackIndex]?.contentId;
      currentQueue = latestToOldest;

      const newIndex = currentQueue.findIndex(t => t.contentId === activeContentId);
      if (newIndex !== -1) {
        currentTrackIndex = newIndex;
      }

      if (playMode === "shuffle" && unplayedShuffleIndices.length === 0) {
        initShufflePool();
      }
    }

    function handleTrackEnded() {
      // 1. Play priority new media immediately
      if (priorityQueue.length > 0) {
        const next = priorityQueue.shift();
        const foundIndex = currentQueue.findIndex(t => t.contentId === next.contentId);
        currentTrackIndex = (foundIndex !== -1) ? foundIndex : 0;
        loadAndPlayTrack(next);
        return;
      }

      // 2. Play according to selected mode
      if (playMode === "shuffle") {
        if (unplayedShuffleIndices.length === 0) {
          initShufflePool();
        }
        if (unplayedShuffleIndices.length > 0) {
          currentTrackIndex = unplayedShuffleIndices.pop();
          loadAndPlayTrack(currentQueue[currentTrackIndex]);
        } else {
          skipToNextTrack();
        }
      } else {
        skipToNextTrack();
      }
    }

    function skipToNextTrack() {
      if (currentQueue.length === 0) return;

      if (playMode === "shuffle") {
        if (unplayedShuffleIndices.length === 0) initShufflePool();
        if (unplayedShuffleIndices.length > 0) {
          currentTrackIndex = unplayedShuffleIndices.pop();
        }
      } else {
        currentTrackIndex++;
        if (currentTrackIndex >= currentQueue.length) currentTrackIndex = 0;
      }

      loadAndPlayTrack(currentQueue[currentTrackIndex]);
    }

    function skipToPreviousTrack() {
      if (currentQueue.length === 0) return;
      currentTrackIndex--;
      if (currentTrackIndex < 0) currentTrackIndex = currentQueue.length - 1;
      loadAndPlayTrack(currentQueue[currentTrackIndex]);
    }

    function preloadNextTrack() {
      if (currentQueue.length <= 1) return;
      let nextIndex = (playMode === "shuffle" && unplayedShuffleIndices.length > 0)
        ? unplayedShuffleIndices[unplayedShuffleIndices.length - 1]
        : (currentTrackIndex + 1) % currentQueue.length;

      const nextTrack = currentQueue[nextIndex];
      if (!nextTrack) return;

      let existingPreload = document.getElementById("nextMediaPreload");
      if (existingPreload) existingPreload.remove();

      const preloadLink = document.createElement("link");
      preloadLink.id = "nextMediaPreload";
      preloadLink.rel = "preload";
      preloadLink.as = "audio";
      preloadLink.href = `https://drive.google.com/uc?export=download&id=${encodeURIComponent(nextTrack.fileId)}`;
      document.head.appendChild(preloadLink);
    }

    function loadAndPlayTrack(track) {
      if (!track) return;
      setupAudioPipeline();

      if (activeFetchAbortController) {
        activeFetchAbortController.abort();
        activeFetchAbortController = null;
      }

      document.getElementById("currentTitle").textContent = track.title || track.fileName;
      document.getElementById("currentContributor").textContent = `BROADCAST BY @${track.uploaderUsername} (${track.uploaderName})`;

      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = null;
      }

      audioElement.pause();
      audioElement.src = `https://drive.google.com/uc?export=download&id=${encodeURIComponent(track.fileId)}`;
      audioElement.load();

      const playPromise = audioElement.play();
      if (playPromise !== undefined) {
        playPromise.catch((err) => {
          if (err.name === "AbortError") return;
          console.warn("Direct stream note, falling back to proxy...", err);
          fallbackStreamViaProxy(track);
        });
      }

      syncMediaSession(track);
      preloadNextTrack();
    }

    async function fallbackStreamViaProxy(track) {
      if (!track) return;
      if (activeFetchAbortController) activeFetchAbortController.abort();
      activeFetchAbortController = new AbortController();

      try {
        const streamUrl = `${GAS_ENDPOINT_URL}?action=streamAudio&fileId=${encodeURIComponent(track.fileId)}`;
        const res = await fetch(streamUrl, {
          method: "GET",
          mode: "cors",
          signal: activeFetchAbortController.signal
        });
        const json = await res.json();

        if (!json.success || !json.base64) {
          throw new Error(json.error || "Proxy failed.");
        }

        const clean = json.base64.replace(/\s/g, "");
        const binary = atob(clean);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }

        const blob = new Blob([bytes], { type: json.mimeType || "audio/mpeg" });
        if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = URL.createObjectURL(blob);

        audioElement.pause();
        audioElement.src = currentBlobUrl;
        audioElement.load();
        audioElement.play().catch(() => {});
      } catch (err) {
        if (err.name === "AbortError") return;
        console.warn("Proxy fallback failed:", err);
        setTimeout(handleTrackEnded, 1500);
      }
    }

    function togglePlayback() {
      setupAudioPipeline();

      if (currentQueue.length === 0) {
        showToast("No audio in live buffer.");
        return;
      }

      if (!audioElement.src || audioElement.src === "" || audioElement.src === window.location.href) {
        loadAndPlayTrack(currentQueue[currentTrackIndex]);
        return;
      }

      if (audioElement.paused) {
        audioElement.play().catch((err) => {
          if (err.name !== "AbortError") console.warn("Playback notice:", err);
        });
      } else {
        audioElement.pause();
      }
    }

    function updatePlayStateUI() {
      const disk = document.getElementById("vinylDisk");
      const playIcon = document.getElementById("playIcon");
      const liveDot = document.getElementById("liveDot");
      const liveStatusText = document.getElementById("liveStatusText");

      if (isPlaying) {
        disk.classList.add("spinning");
        liveDot.classList.add("active");
        liveStatusText.textContent = "ON AIR";
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        disk.classList.remove("spinning");
        liveDot.classList.remove("active");
        liveStatusText.textContent = "STANDBY";
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }

    function renderVisualizer() {
      if (isTV || !analyser) return;

      const canvas = document.getElementById("visCanvas");
      const ctx = canvas.getContext("2d");

      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function draw() {
        animationFrame = requestAnimationFrame(draw);
        if (document.hidden) return;

        analyser.getByteFrequencyData(dataArray);
        ctx.resetTransform();
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);

        const barCount = 48;
        const barWidth = (canvas.clientWidth / barCount) - 2;
        let x = 0;

        for (let i = 0; i < barCount; i++) {
          const barHeight = (dataArray[i * 2] / 255) * canvas.clientHeight * 0.85;
          const gradient = ctx.createLinearGradient(0, canvas.clientHeight, 0, 0);
          gradient.addColorStop(0, "#7928CA");
          gradient.addColorStop(1, "#00F0FF");

          ctx.fillStyle = gradient;
          ctx.fillRect(x, canvas.clientHeight - barHeight, barWidth, barHeight);
          x += barWidth + 2;
        }
      }
      draw();
    }

    function initVisibilityChangeHandler() {
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          if (animationFrame) cancelAnimationFrame(animationFrame);
        } else {
          if (analyser && !isTV) renderVisualizer();
        }
      });
    }

    function formatTime(seconds) {
      const s = parseInt(seconds, 10) || 0;
      const mins = Math.floor(s / 60);
      const secs = s % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
  </script>
